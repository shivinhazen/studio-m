name: Apply security refresh

on:
  push:
    branches: [security/contact-hardening-2026-08-29]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[security-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/contact-hardening-2026-08-29
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate validated lockfile and align UI
        run: |
          sed -i 's/20 MB/15 MB/g' app/contato/contact-content.tsx
          npm install
          npm audit fix || true
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run lint:deps
          npm run build
      - name: Commit validated generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/contato/contact-content.tsx
          git diff --cached --quiet || git commit -m "chore: align validated security lockfile [security-lock]"
          git push origin HEAD:security/contact-hardening-2026-08-29
