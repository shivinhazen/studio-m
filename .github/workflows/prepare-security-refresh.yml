name: Prepare security refresh

on:
  push:
    branches: [security/contact-hardening-2026-08-29]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh and validate
        run: |
          sed -i 's/20 MB/15 MB/g' app/contato/contact-content.tsx
          npm install
          npm audit fix || true
          npm ci
          npm run lint
          npm run lint:deps
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: studio-m-security-refresh
          path: |
            package.json
            package-lock.json
            app/contato/contact-content.tsx
